services:
  api:
    environment:
      AO_A2A_ROUTING: direct
      AO_LLM_MODE: mock
      AO_POLICY_MODE: observe
      AO_OPA_URL: ""
      AO_SEED_DEMO_AGENTS: "true"
      # Force the loop guards into a visible range.
      AO_MAX_AGENT_HOPS: "1"
      AO_MAX_A2A_DEPTH: "2"
      AO_BUDGET_DEGRADE_MODEL: openai/gpt-4o-mini-cheap
      AO_BUDGET_SOFT_THRESHOLD: "0.5"
