services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alstom
      POSTGRES_PASSWORD: alstom
      POSTGRES_DB: alstom_ao
    ports:
      - "5432:5432"
    volumes:
      - ao_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alstom -d alstom_ao"]
      interval: 5s
      timeout: 3s
      retries: 20

  opa:
    image: openpolicyagent/opa:1.22.4
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./policies:/policies:ro
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "/opa", "eval", "--fail-defined", "data.system.type"]
      interval: 10s
      timeout: 3s
      retries: 10

  # One reference A2A agent so a fresh checkout has something to test against.
  # Not part of the platform: replace or remove it once real agents are registered.
  reference-agent:
    build: .
    command: ["uvicorn", "examples.reference_agent.app:app", "--host", "0.0.0.0", "--port", "9101"]
    environment:
      # The address the agent card advertises must be reachable by the caller.
      # The LiteLLM gateway is a separate container, so "localhost" would be wrong.
      AO_AGENT_PUBLIC_BASE_URL: http://reference-agent:9101
    ports:
      - "9101:9101"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9101/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Reference MCP server: three read-only tools over MCP streamable HTTP.
  # Not part of the platform — it exists so the MCP adapter has something to call.
  # LiteLLM dials it at http://mcp-reference:9102/mcp; the orchestrator never does.
  mcp-reference:
    build: ./examples/reference_mcp
    environment:
      MCP_PORT: "9102"
    ports:
      - "9102:9102"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); sys.exit(0 if s.connect_ex(('127.0.0.1',9102))==0 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # LiteLLM agent gateway: owns upstream agent routing, logs, spend and protocol
  # version conversion. The orchestration layer calls POST /a2a/{agent} here.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-alstom-master}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ALSTOM_AO_AGENT_KEY: ${ALSTOM_AO_AGENT_KEY:-sk-alstom-agent}
      # Upstream MCP credential. Kept here, never in a card: cards are stored in
      # Postgres and returned by the API.
      SINEQUA_MCP_API_KEY: ${SINEQUA_MCP_API_KEY:-}
      STORE_MODEL_IN_DB: "False"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    depends_on:
      mcp-reference:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
      reference-agent:
        condition: service_started
      litellm:
        condition: service_started
    environment:
      AO_ENVIRONMENT: dev
      AO_DATABASE_URL: postgresql+asyncpg://alstom:alstom@postgres:5432/alstom_ao
      AO_DB_AUTO_CREATE: "true"
      AO_LLM_MODEL: ${AO_LLM_MODEL:-openai/gpt-4o-mini}
      AO_LLM_API_KEY: ${AO_LLM_API_KEY:-}
      AO_LLM_API_BASE: ${AO_LLM_API_BASE:-}
      AO_SYNTHESIS_GROUNDING: ${AO_SYNTHESIS_GROUNDING:-warn}
      AO_LITELLM_PROXY_URL: http://litellm:4000
      AO_LITELLM_PROXY_API_KEY: ${LITELLM_MASTER_KEY:-sk-alstom-master}
      AO_LITELLM_A2A_PROTOCOL_VERSION: ${AO_LITELLM_A2A_PROTOCOL_VERSION:-0.3}
      AO_POLICY_MODE: ${AO_POLICY_MODE:-observe}
      AO_OPA_URL: http://opa:8181
      AO_POLICY_LOCAL_FALLBACK: "true"
      AO_REQUIRE_USER_IDENTITY: "true"
      AO_APPROVAL_ALLOW_SELF: "false"
      AO_LANGFUSE_ENABLED: ${AO_LANGFUSE_ENABLED:-false}
      AO_LANGFUSE_PUBLIC_KEY: ${AO_LANGFUSE_PUBLIC_KEY:-}
      AO_LANGFUSE_SECRET_KEY: ${AO_LANGFUSE_SECRET_KEY:-}
      AO_LANGFUSE_HOST: ${AO_LANGFUSE_HOST:-https://cloud.langfuse.com}
    ports:
      - "8080:8080"

volumes:
  ao_pgdata:
