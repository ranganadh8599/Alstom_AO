# LiteLLM agent gateway configuration.
#
# Every agent the orchestration layer may call is registered here so LiteLLM can
# provide routing, logging, spend attribution and A2A protocol-version handling.
#
# Keep `agent_name` in sync with `metadata.litellm_agent_name` on the Alstom AO
# registry card (or leave that metadata unset and use the card's agent_id).
# Generate this block from the registry with:
#     python scripts/export_litellm_agents.py
#
# The `agents:` block below registers ONE reference agent so a fresh checkout is
# testable immediately. Replace it with your real agents:
#
#   1. register cards in Alstom AO (POST /v1/agents)
#   2. python scripts/export_litellm_agents.py --out litellm/agents.generated.yaml
#
# Keep `agent_name` in sync with `metadata.litellm_agent_name` on the registry
# card, or leave that metadata unset to use the card's agent_id.

model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_prompts_in_spend_logs: true

# ---------------------------------------------------------------------------
# Budgets: deliberately NOT configured here.
#
# Every LiteLLM budget is a hard HTTP 429 (global/team/key max_budget,
# agent max_budget_per_session, agent max_iterations). On agent traffic that 429
# lands on the agent's own model calls mid-run, which breaks the parent workflow
# and discards work already paid for. Per-run guardrails are enforced by the
# orchestration layer instead (soft alert -> model downgrade -> hard gate at the
# graph boundary): see docs/budgets.md.
#
# Use this gateway for org-wide ceilings and soft alerts only, and keep any
# per-session backstop well above AO_LLM_MAX_COST_USD_PER_RUN (~3x):
#
# litellm_settings:
#   max_budget: 500
#   budget_duration: 30d
#
# general_settings:
#   alerting: [slack]
#   alert_types: [budget_alerts]
#
# and per agent, under litellm_params:
#   require_trace_id_on_calls_by_agent: true
#   max_iterations: 60
#   max_budget_per_session: 1.50
# ---------------------------------------------------------------------------

agents:
  - agent_name: finance-invoice-auditor
    agent_card_params:
      name: Finance Invoice Auditor
      description: Audits vendor invoices, detects duplicate charges and checks purchase orders.
      url: http://reference-agent:9101/agents/finance
      version: 1.0.0
      protocolVersion: "0.3"
      preferredTransport: JSONRPC
      additionalInterfaces:
        - url: http://reference-agent:9101/agents/finance
          transport: JSONRPC
      capabilities:
        streaming: false
        pushNotifications: false
      defaultInputModes: [text/plain]
      defaultOutputModes: [text/plain, application/json]
      skills:
        - id: invoice-audit
          name: invoice audit
          description: Compare an invoice with its purchase order and payment history.
          tags: [finance, invoice, audit, duplicate]
          examples:
            - Check invoice INV-2024-0912 for duplicate charges
    litellm_params:
      api_key: os.environ/ALSTOM_AO_AGENT_KEY

# ---------------------------------------------------------------------------
# MCP servers.
#
# LiteLLM is the MCP gateway: it owns the MCP session (initialize, protocol
# negotiation, transport, reconnects) and the upstream credentials, and exposes
# the tools to Alstom AO over REST:
#     GET  /mcp-rest/tools/list
#     POST /mcp-rest/tools/call
# The orchestrator never speaks MCP itself and never dials a server.
#
# Replace `alstom_reference` with your real MCP servers. Both the server key and
# the upstream tool name are referenced from the AO card:
#     metadata.mcp_server_id: alstom_reference
#     metadata.mcp_tool:      invoice_status
# ---------------------------------------------------------------------------
mcp_servers:
  alstom_reference:
    url: "http://mcp-reference:9102/mcp"
    transport: "http"
    auth_type: "none"
  # Sinequa Search (Ronaldo MCP server).
  #
  # The API key is read from the gateway's environment, never from this file and
  # never from an AO card: cards are stored in Postgres and returned by the API.
  # Set SINEQUA_MCP_API_KEY in .env (gitignored) and restart litellm.
  #
  # The host is internal (dev-globalsearch.alstom.hub), so the gateway needs
  # corporate DNS/VPN. Add `network_mode` or a DNS entry if the container cannot
  # resolve it while the host can.
  ronaldo_sinequa:
    url: "https://dev-globalsearch.alstom.hub/mcp/Ronaldo_SinequaSearch"
    transport: "http"
    auth_type: "bearer_token"
    auth_value: os.environ/SINEQUA_MCP_API_KEY